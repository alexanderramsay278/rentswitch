name: Fetch sources

# Keeps a text copy of every government document a figure is taken from, so each
# number in data/ can be checked against the source. Runs when the URL list changes.
on:
  workflow_dispatch:
  push:
    branches: [claude/run-routine-ylyotu]
    paths:
      - data/sources/_urls.txt

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -q poppler-utils
      - name: Download and convert
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130 Safari/537.36"
          grep -v '^#' data/sources/_urls.txt | grep -v '^$' | while read -r url; do
            name=$(basename "${url%%\?*}"); name="${name%.pdf}"
            if curl -fsSL --http1.1 --max-time 90 --retry 2 -A "$UA" -o /tmp/src "$url"; then
              if file /tmp/src | grep -q PDF; then
                pdftotext -layout /tmp/src "data/sources/$name.txt"
              else
                python3 -c "import html,re,sys;t=open('/tmp/src',encoding='utf-8',errors='ignore').read();t=re.sub(r'(?s)<(script|style).*?</\1>','',t);t=re.sub(r'<[^>]+>','\n',t);t=html.unescape(t);print(re.sub(r'\n\s*\n+','\n',t))" > "data/sources/$name.txt"
              fi
              echo "OK   $url"
            else
              echo "FAIL $url"
            fi
          done
      - name: Commit
        run: |
          git config user.name "Alex Ramsay"
          git config user.email "alexanderramsay278@gmail.com"
          git add data/sources
          git diff --cached --quiet && exit 0
          git commit -m "Keep text copies of the source documents"
          git push
